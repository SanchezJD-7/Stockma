    <title>Stockma-app</title>
    <script>
      // Aplica el tema guardado antes del primer pintado (igual que la app real).
      try {
        var guardado = localStorage.getItem('stockma-theme')
        if (guardado === 'light' || guardado === 'dark') {
          document.documentElement.dataset.theme = guardado
        } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
          document.documentElement.dataset.theme = 'dark'
        }
      } catch {
        /* sin almacenamiento: queda en claro */
      }
    </script>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
